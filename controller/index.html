<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0d0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lux Controller</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="gamepad-layout.css">
  <link rel="stylesheet" href="hub.css?v=151">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="skin-lux layout-gba">
  <!-- O hub decide o que fica visível. No navegador comum o controle nunca é liberado. -->
  <section id="joinScreen" class="screen" aria-label="Conectar Lux Pad">
    <div class="panel">
      <div class="brand">LUX PAD</div>
      <p>Seu celular como gamepad.</p>
      <label for="roomCode">Código da sala</label>
      <input id="roomCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
      <div class="player-grid"><button class="player active" data-player="1">Jogador 1</button><button class="player" data-player="2">Jogador 2</button></div>
      <button id="connectBtn" class="primary">Conectar controle</button>
      <div id="joinStatus" class="status offline">● Desconectado</div>
      <small>O código pode ser preenchido automaticamente pelo QR Code do Lux Play.</small>
    </div>
  </section>

  <section id="controllerScreen" class="screen" aria-label="Lux Pad">
    <header class="topbar">
      <div><strong>Lux Pad</strong><span id="sessionLabel">Sem sessão</span></div>
      <div class="toolbar">
        <select id="layoutSelect" aria-label="Console"><option value="gb">GB / GBC</option><option value="gba" selected>GBA</option><option value="nes">NES</option><option value="snes">SNES</option><option value="megadrive3">Mega Drive 3B</option><option value="megadrive6">Mega Drive 6B</option><option value="n64">N64</option></select>
        <select id="skinSelect" aria-label="Skin"><option value="lux">Lux</option><option value="classic">Classic</option><option value="dark">Dark</option></select>
        <button id="disconnectBtn" class="danger">Desconectar</button>
      </div>
    </header>
    <main id="gamepad" class="gamepad locked">
      <div class="dpad-zone"><div class="dpad"><button class="pad-btn up" data-input="UP">▲</button><button class="pad-btn left" data-input="LEFT">◀</button><div class="dpad-center"></div><button class="pad-btn right" data-input="RIGHT">▶</button><button class="pad-btn down" data-input="DOWN">▼</button></div></div>
      <div id="shoulderZone" class="shoulder-zone"></div>
      <div id="centerZone" class="center-zone"></div>
      <div id="actionZone" class="action-zone"></div>
      <div id="analogZone" class="analog-zone hidden"><div id="analogStick" class="analog-stick"><div class="analog-knob"></div></div></div>
    </main>
    <div id="rotateMessage" class="rotate-message">↻<br><strong>Gire o celular para jogar</strong></div>
  </section>

  <script src="./gamepad-core.js?v=151"></script>
  <script src="./hub.js?v=151"></script>
  <script src="./orientation.js?v=151"></script>
</body>
</html>
