<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0d0d12">
  <title>Lux Controller</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="gamepad-layout.css">
</head>
<body class="skin-lux layout-gba">
  <section id="joinScreen" class="screen active">
    <div class="panel">
      <div class="brand">LUX CONTROLLER</div>
      <p>Seu celular como gamepad.</p>
      <label for="roomCode">Código da sala</label>
      <input id="roomCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
      <div class="player-grid">
        <button class="player active" data-player="1">Jogador 1</button>
        <button class="player" data-player="2">Jogador 2</button>
      </div>
      <button id="connectBtn" class="primary">Conectar controle</button>
      <div id="joinStatus" class="status offline">● Desconectado</div>
      <small>Por enquanto a conexão é simulada para testar o gamepad. O transporte real entra na próxima etapa.</small>
    </div>
  </section>

  <section id="controllerScreen" class="screen">
    <header class="topbar">
      <div>
        <strong>Lux Controller</strong>
        <span id="sessionLabel">Sem sessão</span>
      </div>
      <div class="toolbar">
        <select id="layoutSelect" aria-label="Console">
          <option value="gb">GB / GBC</option>
          <option value="gba" selected>GBA</option>
          <option value="nes">NES</option>
          <option value="snes">SNES</option>
          <option value="megadrive3">Mega Drive 3B</option>
          <option value="megadrive6">Mega Drive 6B</option>
          <option value="n64">N64</option>
        </select>
        <select id="skinSelect" aria-label="Skin">
          <option value="lux">Lux</option>
          <option value="classic">Classic</option>
          <option value="dark">Dark</option>
        </select>
        <button id="disconnectBtn" class="danger">Desconectar</button>
      </div>
    </header>

    <main id="gamepad" class="gamepad locked" aria-label="Gamepad virtual">
      <div class="dpad-zone">
        <div class="dpad">
          <button class="pad-btn up" data-input="UP">▲</button>
          <button class="pad-btn left" data-input="LEFT">◀</button>
          <div class="dpad-center"></div>
          <button class="pad-btn right" data-input="RIGHT">▶</button>
          <button class="pad-btn down" data-input="DOWN">▼</button>
        </div>
      </div>
      <div id="shoulderZone" class="shoulder-zone"></div>
      <div id="centerZone" class="center-zone"></div>
      <div id="actionZone" class="action-zone"></div>
      <div id="analogZone" class="analog-zone hidden">
        <div id="analogStick" class="analog-stick"><div class="analog-knob"></div></div>
      </div>
    </main>

    <aside id="debugPanel" class="debug-panel">
      <strong>Input log</strong>
      <pre id="debugLog"></pre>
    </aside>

    <div id="rotateMessage" class="rotate-message">↻<br><strong>Gire o celular para jogar</strong></div>
  </section>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'lux-controller-v012';
  const layouts = {
    gb: { cls:'layout-gb', shoulders:[], center:['SELECT','START'], actions:['B','A'], analog:false },
    gba: { cls:'layout-gba', shoulders:['L','R'], center:['SELECT','START'], actions:['B','A'], analog:false },
    nes: { cls:'layout-nes', shoulders:[], center:['SELECT','START'], actions:['B','A'], analog:false },
    snes: { cls:'layout-snes', shoulders:['L','R'], center:['SELECT','START'], actions:['Y','X','B','A'], analog:false },
    megadrive3: { cls:'layout-megadrive3', shoulders:[], center:['START'], actions:['A','B','C'], analog:false },
    megadrive6: { cls:'layout-megadrive6', shoulders:[], center:['MODE','START'], actions:['X','Y','Z','A','B','C'], analog:false },
    n64: { cls:'layout-n64', shoulders:['L','Z','R'], center:['START'], actions:['B','A','C_UP','C_LEFT','C_RIGHT','C_DOWN'], analog:true }
  };

  const state = {
    connected:false,
    player:1,
    room:'',
    layout:'gba',
    skin:'lux',
    haptics:true,
    pressed:new Map(),
    analogPointer:null,
    analog:{x:0,y:0}
  };

  const $ = s => document.querySelector(s);
  const els = {
    join:$('#joinScreen'), controller:$('#controllerScreen'), room:$('#roomCode'), connect:$('#connectBtn'),
    joinStatus:$('#joinStatus'), session:$('#sessionLabel'), layout:$('#layoutSelect'), skin:$('#skinSelect'),
    disconnect:$('#disconnectBtn'), gamepad:$('#gamepad'), shoulder:$('#shoulderZone'), center:$('#centerZone'),
    action:$('#actionZone'), analog:$('#analogZone'), stick:$('#analogStick'), log:$('#debugLog')
  };

  function sanitizeCode(v){ return String(v||'').replace(/\D/g,'').slice(0,6); }
  function pretty(v){ return ({SELECT:'Select',START:'Start',MODE:'Mode',C_UP:'C▲',C_LEFT:'C◀',C_RIGHT:'C▶',C_DOWN:'C▼'})[v]||v; }

  function loadPrefs(){
    try {
      const p=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
      if(layouts[p.layout]) state.layout=p.layout;
      if(['lux','classic','dark'].includes(p.skin)) state.skin=p.skin;
      if(p.player===1||p.player===2) state.player=p.player;
    } catch {}
  }

  function savePrefs(){
    localStorage.setItem(STORAGE_KEY,JSON.stringify({layout:state.layout,skin:state.skin,player:state.player}));
  }

  function setPlayer(n){
    state.player=n;
    document.querySelectorAll('.player').forEach(b=>b.classList.toggle('active',Number(b.dataset.player)===n));
    savePrefs();
  }

  function makeButton(input, extra=''){
    const b=document.createElement('button');
    b.className=`pad-btn ${extra}`;
    b.dataset.input=input;
    b.textContent=pretty(input);
    return b;
  }

  function renderLayout(){
    const cfg=layouts[state.layout];
    document.body.className=`skin-${state.skin} ${cfg.cls}`;
    els.shoulder.innerHTML='';
    els.center.innerHTML='';
    els.action.innerHTML='';
    cfg.shoulders.forEach(x=>els.shoulder.appendChild(makeButton(x,'shoulder-btn')));
    cfg.center.forEach(x=>els.center.appendChild(makeButton(x,'center-btn')));
    cfg.actions.forEach(x=>els.action.appendChild(makeButton(x,`action-btn action-${x.toLowerCase().replaceAll('_','-')}`)));
    els.analog.classList.toggle('hidden',!cfg.analog);
    bindButtons();
    savePrefs();
  }

  function setConnection(connected){
    state.connected=connected;
    els.gamepad.classList.toggle('locked',!connected);
    els.joinStatus.className=`status ${connected?'online':'offline'}`;
    els.joinStatus.textContent=connected?'● Conectado':'● Desconectado';
    if(!connected) releaseEverything();
  }

  async function connect(){
    const code=sanitizeCode(els.room.value);
    if(code.length!==6){ els.room.focus(); return; }
    els.connect.disabled=true;
    els.connect.textContent='Conectando...';
    els.joinStatus.textContent='● Conectando...';
    await new Promise(r=>setTimeout(r,350));
    state.room=code;
    setConnection(true);
    els.session.textContent=`Sala ${code.slice(0,3)} ${code.slice(3)} • P${state.player} • modo de teste`;
    els.join.classList.remove('active');
    els.controller.classList.add('active');
    els.connect.disabled=false;
    els.connect.textContent='Conectar controle';
    if(document.documentElement.requestFullscreen && innerWidth>innerHeight){ document.documentElement.requestFullscreen().catch(()=>{}); }
  }

  function disconnect(){
    setConnection(false);
    state.room='';
    els.controller.classList.remove('active');
    els.join.classList.add('active');
    els.joinStatus.className='status offline';
    els.joinStatus.textContent='● Desconectado';
    document.exitFullscreen?.().catch?.(()=>{});
  }

  function emitInput(payload){
    if(!state.connected) return;
    const packet={
      type:payload.type||'digital', player:state.player, room:state.room, layout:state.layout,
      input:payload.input, pressed:payload.pressed ?? null, value:payload.value ?? null,
      timestamp:performance.now()
    };
    window.dispatchEvent(new CustomEvent('luxcontrollerinput',{detail:packet}));
    const line=packet.type==='analog'
      ? `P${packet.player} ${packet.input} ${Number(packet.value).toFixed(2)}`
      : `P${packet.player} ${packet.input} ${packet.pressed?'DOWN':'UP'}`;
    const rows=els.log.textContent.split('\n').filter(Boolean); rows.unshift(line); els.log.textContent=rows.slice(0,14).join('\n');
  }

  function vibrate(){ if(state.haptics && navigator.vibrate) navigator.vibrate(8); }

  function press(el,pointerId){
    if(!state.connected) return;
    const input=el.dataset.input, key=`${input}:${pointerId}`;
    if(!input||state.pressed.has(key)) return;
    state.pressed.set(key,{input,el,pointerId});
    el.classList.add('pressed');
    emitInput({input,pressed:true});
    vibrate();
  }

  function releasePointer(pointerId){
    [...state.pressed.entries()].filter(([,v])=>v.pointerId===pointerId).forEach(([key,v])=>{
      state.pressed.delete(key);
      if(![...state.pressed.values()].some(x=>x.input===v.input)) v.el.classList.remove('pressed');
      emitInput({input:v.input,pressed:false});
    });
  }

  function bindButtons(){
    document.querySelectorAll('[data-input]').forEach(btn=>{
      if(btn.dataset.bound) return;
      btn.dataset.bound='1';
      btn.addEventListener('pointerdown',e=>{ e.preventDefault(); try{btn.setPointerCapture(e.pointerId)}catch{} press(btn,e.pointerId); });
      ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,e=>{e.preventDefault();releasePointer(e.pointerId)}));
      btn.addEventListener('contextmenu',e=>e.preventDefault());
    });
  }

  function releaseEverything(){ [...new Set([...state.pressed.values()].map(v=>v.pointerId))].forEach(releasePointer); resetAnalog(); }

  function setAnalog(x,y){
    if(!state.connected) return;
    if(Math.abs(x-state.analog.x)>.02){ state.analog.x=x; emitInput({type:'analog',input:'ANALOG_X',value:x}); }
    if(Math.abs(y-state.analog.y)>.02){ state.analog.y=y; emitInput({type:'analog',input:'ANALOG_Y',value:y}); }
  }

  function resetAnalog(){
    const knob=els.stick.querySelector('.analog-knob'); knob.style.transform='translate(0,0)';
    if(state.analog.x!==0) emitInput({type:'analog',input:'ANALOG_X',value:0});
    if(state.analog.y!==0) emitInput({type:'analog',input:'ANALOG_Y',value:0});
    state.analog={x:0,y:0}; state.analogPointer=null;
  }

  function setupAnalog(){
    const knob=els.stick.querySelector('.analog-knob');
    const update=e=>{
      const r=els.stick.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, max=r.width*.33;
      let dx=e.clientX-cx, dy=e.clientY-cy, d=Math.hypot(dx,dy);
      if(d>max){ const k=max/d; dx*=k; dy*=k; }
      knob.style.transform=`translate(${dx}px,${dy}px)`;
      setAnalog(Math.max(-1,Math.min(1,dx/max)),Math.max(-1,Math.min(1,dy/max)));
    };
    els.stick.addEventListener('pointerdown',e=>{ if(!state.connected)return; e.preventDefault(); state.analogPointer=e.pointerId; try{els.stick.setPointerCapture(e.pointerId)}catch{} update(e); vibrate(); });
    els.stick.addEventListener('pointermove',e=>{ if(state.analogPointer===e.pointerId){ e.preventDefault(); update(e); } });
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>els.stick.addEventListener(ev,e=>{ if(state.analogPointer===e.pointerId) resetAnalog(); }));
  }

  document.querySelectorAll('.player').forEach(b=>b.addEventListener('click',()=>setPlayer(Number(b.dataset.player))));
  els.room.addEventListener('input',()=>els.room.value=sanitizeCode(els.room.value));
  els.room.addEventListener('keydown',e=>{if(e.key==='Enter')connect()});
  els.connect.addEventListener('click',connect);
  els.disconnect.addEventListener('click',disconnect);
  els.layout.addEventListener('change',()=>{releaseEverything();state.layout=els.layout.value;renderLayout()});
  els.skin.addEventListener('change',()=>{state.skin=els.skin.value;renderLayout()});
  window.addEventListener('blur',releaseEverything);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseEverything()});
  document.addEventListener('touchmove',e=>{if(els.controller.classList.contains('active'))e.preventDefault()},{passive:false});

  loadPrefs();
  const urlCode=sanitizeCode(new URL(location.href).searchParams.get('code'));
  if(urlCode) els.room.value=urlCode;
  els.layout.value=state.layout; els.skin.value=state.skin; setPlayer(state.player); renderLayout(); setupAnalog(); setConnection(false);

  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

  window.LuxController={
    connect, disconnect,
    getState:()=>({...state,pressed:[...state.pressed.values()]}),
    setLayout(name){ if(!layouts[name])return false; releaseEverything();state.layout=name;els.layout.value=name;renderLayout();return true; },
    emitInput
  };
})();
</script>
</body>
</html>
