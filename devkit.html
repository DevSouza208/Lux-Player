<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lux Player — DevKit</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Consolas, "Cascadia Code", "Courier New", monospace;
      background: #050505;
      color: #d7d7d7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #d7d7d7;
      overflow: hidden;
    }
    header {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid #242424;
      background: #090909;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .title { font-weight: 800; letter-spacing: .08em; color: #fff; white-space: nowrap; }
    .version { color: #777; font-size: 12px; }
    .spacer { flex: 1; }
    .connection { font-size: 12px; color: #888; white-space: nowrap; }
    .connection.live { color: #74e394; }
    button {
      background: #111;
      color: #d7d7d7;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 7px 10px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { border-color: #666; background: #181818; }
    .summary {
      height: 34px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 16px;
      border-bottom: 1px solid #181818;
      background: #070707;
      font-size: 11px;
      color: #777;
    }
    .summary strong { color: #aaa; font-weight: 600; }
    #terminal {
      height: calc(100vh - 92px);
      overflow-y: auto;
      padding: 10px 14px 40px;
      scroll-behavior: smooth;
    }
    .line {
      display: grid;
      grid-template-columns: 76px 88px 20px minmax(130px, 230px) 1fr auto;
      gap: 10px;
      align-items: baseline;
      min-height: 24px;
      padding: 3px 0;
      border-bottom: 1px solid #0c0c0c;
      font-size: 13px;
      line-height: 1.35;
    }
    .time, .category, .duration { color: #666; }
    .category { color: #8f8f8f; }
    .dot { font-size: 15px; line-height: 1; }
    .label { color: #cfcfcf; font-weight: 700; word-break: break-word; }
    .message { color: #a6a6a6; white-space: pre-wrap; word-break: break-word; }
    .duration { text-align: right; white-space: nowrap; }
    .status-info .dot { color: #8b8b8b; }
    .status-running .dot { color: #d6d6d6; }
    .status-success .dot, .status-success .label { color: #65dc86; }
    .status-warning .dot, .status-warning .label { color: #f0c75e; }
    .status-error .dot, .status-error .label { color: #ff6262; }
    .details {
      grid-column: 4 / -1;
      margin: 2px 0 6px;
      color: #6f6f6f;
      font-size: 11px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .empty {
      color: #555;
      padding: 28px 4px;
      font-size: 13px;
    }
    .copy-fallback {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0,0,0,.86);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .copy-fallback.hidden { display: none; }
    .copy-card {
      width: min(980px, 100%);
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 18px 70px rgba(0,0,0,.65);
    }
    .copy-card h2 { margin: 0; color: #fff; font-size: 15px; }
    .copy-card p { margin: 0; color: #888; font-size: 12px; }
    #manualCopyText {
      width: 100%;
      min-height: 55vh;
      resize: vertical;
      background: #050505;
      color: #ddd;
      border: 1px solid #2a2a2a;
      border-radius: 7px;
      padding: 12px;
      font: 12px/1.45 Consolas, "Cascadia Code", monospace;
      outline: none;
    }
    .copy-actions { display: flex; justify-content: flex-end; gap: 8px; }
    @media (max-width: 860px) {
      header { flex-wrap: wrap; height: auto; padding: 10px; }
      .spacer { display: none; }
      .summary { overflow-x: auto; }
      #terminal { height: calc(100vh - 126px); }
      .line {
        grid-template-columns: 68px 74px 16px 1fr;
        gap: 7px;
        font-size: 12px;
      }
      .message { grid-column: 4; }
      .duration { grid-column: 4; text-align: left; }
      .details { grid-column: 4; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">LUX PLAYER // DEVKIT</div>
    <div class="version">1.3.2</div>
    <div class="spacer"></div>
    <div id="connection" class="connection">aguardando Lux Player…</div>
    <button id="pauseBtn" type="button">Pausar scroll</button>
    <button id="copyBtn" type="button">Copiar log</button>
    <button id="clearBtn" type="button">Limpar</button>
  </header>

  <div class="summary">
    <span>Total <strong id="totalCount">0</strong></span>
    <span>OK <strong id="okCount">0</strong></span>
    <span>Avisos <strong id="warnCount">0</strong></span>
    <span>Paradas/erros <strong id="errorCount">0</strong></span>
    <span>Em andamento <strong id="runningCount">0</strong></span>
  </div>

  <div id="copyFallback" class="copy-fallback hidden" role="dialog" aria-modal="true" aria-labelledby="copyFallbackTitle">
    <div class="copy-card">
      <h2 id="copyFallbackTitle">Cópia automática bloqueada pelo navegador</h2>
      <p>O log inteiro já está selecionado. Pressione <strong>Ctrl+C</strong> e depois feche esta janela.</p>
      <textarea id="manualCopyText" readonly></textarea>
      <div class="copy-actions">
        <button id="manualSelectBtn" type="button">Selecionar tudo</button>
        <button id="manualCloseBtn" type="button">Fechar</button>
      </div>
    </div>
  </div>

  <main id="terminal" aria-live="polite">
    <div class="empty" id="emptyState">Esperando eventos do Lux Player…</div>
  </main>

  <script>
    (() => {
      'use strict';

      const CHANNEL_NAME = 'lux-player-devkit-v1';
      const STORAGE_KEY = 'lux_devkit_events_v1';
      const SIGNAL_KEY = 'lux_devkit_signal_v1';
      const MAX_EVENTS = 500;

      const terminal = document.getElementById('terminal');
      const connection = document.getElementById('connection');
      const pauseBtn = document.getElementById('pauseBtn');
      const copyBtn = document.getElementById('copyBtn');
      const clearBtn = document.getElementById('clearBtn');
      const copyFallback = document.getElementById('copyFallback');
      const manualCopyText = document.getElementById('manualCopyText');
      const manualSelectBtn = document.getElementById('manualSelectBtn');
      const manualCloseBtn = document.getElementById('manualCloseBtn');
      let paused = false;
      let connected = false;
      let events = [];
      let channel = null;
      const ids = new Set();

      const counters = {
        total: document.getElementById('totalCount'),
        success: document.getElementById('okCount'),
        warning: document.getElementById('warnCount'),
        error: document.getElementById('errorCount'),
        running: document.getElementById('runningCount')
      };

      function markConnected(source = 'canal') {
        connected = true;
        connection.textContent = 'ao vivo · ' + source;
        connection.classList.add('live');
      }

      function safeParse(raw, fallback) {
        try { return JSON.parse(raw); } catch (_) { return fallback; }
      }

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[char]));
      }

      function formatDuration(ms) {
        if (ms == null || !Number.isFinite(Number(ms))) return '';
        const value = Number(ms);
        return value >= 1000 ? (value / 1000).toFixed(value >= 10000 ? 1 : 2) + ' s' : Math.round(value) + ' ms';
      }

      function statusDot(status) {
        return status === 'success' ? '●'
          : status === 'warning' ? '▲'
          : status === 'error' ? '■'
          : status === 'running' ? '●'
          : '·';
      }

      function updateCounters() {
        counters.total.textContent = events.length;
        counters.success.textContent = events.filter(item => item.status === 'success').length;
        counters.warning.textContent = events.filter(item => item.status === 'warning').length;
        counters.error.textContent = events.filter(item => item.status === 'error').length;
        counters.running.textContent = events.filter(item => item.status === 'running').length;
      }

      function lineHtml(event) {
        const details = event.data == null ? '' :
          '<div class="details">' + escapeHtml(JSON.stringify(event.data, null, 2)) + '</div>';
        return '<div class="line status-' + escapeHtml(event.status || 'info') + '" data-id="' + escapeHtml(event.id) + '">' +
          '<span class="time">' + escapeHtml(event.time || '') + '</span>' +
          '<span class="category">' + escapeHtml(event.category || 'APP') + '</span>' +
          '<span class="dot">' + statusDot(event.status) + '</span>' +
          '<span class="label">' + escapeHtml(event.label || 'evento') + '</span>' +
          '<span class="message">' + escapeHtml(event.message || '') + '</span>' +
          '<span class="duration">' + escapeHtml(formatDuration(event.durationMs)) + '</span>' +
          details +
        '</div>';
      }

      function renderAll() {
        terminal.innerHTML = events.length
          ? events.map(lineHtml).join('')
          : '<div class="empty" id="emptyState">Esperando eventos do Lux Player…</div>';
        updateCounters();
        if (!paused) terminal.scrollTop = terminal.scrollHeight;
      }

      function addEvent(event) {
        if (!event || !event.id || ids.has(event.id)) return;
        ids.add(event.id);
        events.push(event);
        if (events.length > MAX_EVENTS) {
          const removed = events.splice(0, events.length - MAX_EVENTS);
          removed.forEach(item => ids.delete(item.id));
          renderAll();
          return;
        }
        document.getElementById('emptyState')?.remove();
        terminal.insertAdjacentHTML('beforeend', lineHtml(event));
        updateCounters();
        if (!paused) terminal.scrollTop = terminal.scrollHeight;
      }

      function mergeSnapshot(list) {
        if (!Array.isArray(list)) return;
        list.slice(-MAX_EVENTS).forEach(addEvent);
      }

      function readStorage() {
        const stored = safeParse(localStorage.getItem(STORAGE_KEY) || '[]', []);
        mergeSnapshot(stored);
      }

      function clearLocal() {
        events = [];
        ids.clear();
        renderAll();
      }

      function requestClear() {
        clearLocal();
        try {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(SIGNAL_KEY);
        } catch (_) {}
        try { channel?.postMessage({ type: 'clear' }); } catch (_) {}
        try { window.opener?.postMessage({ type: 'LUX_DEVKIT_CLEAR' }, '*'); } catch (_) {}
      }

      function buildLogText() {
        const counts = {
          success: events.filter(item => item.status === 'success').length,
          warning: events.filter(item => item.status === 'warning').length,
          error: events.filter(item => item.status === 'error').length,
          running: events.filter(item => item.status === 'running').length
        };
        const header = [
          'LUX PLAYER // DEVKIT 1.3.2',
          'Gerado em: ' + new Date().toLocaleString('pt-BR'),
          'Eventos: ' + events.length +
            ' | OK: ' + counts.success +
            ' | Avisos: ' + counts.warning +
            ' | Erros/paradas: ' + counts.error +
            ' | Em andamento: ' + counts.running,
          '------------------------------------------------------------'
        ];

        const body = events.map(event => {
          const duration = formatDuration(event.durationMs);
          const details = event.data == null ? '' : '\n  dados: ' + JSON.stringify(event.data);
          return [event.time, event.category, event.status.toUpperCase(), event.label, event.message, duration]
            .filter(Boolean).join(' | ') + details;
        });

        return [...header, ...body].join('\n');
      }

      function showCopiedState() {
        copyBtn.textContent = 'Log copiado ✓';
        copyBtn.disabled = true;
        setTimeout(() => {
          copyBtn.textContent = 'Copiar log';
          copyBtn.disabled = false;
        }, 1800);
      }

      function manualCopyFallback(text) {
        manualCopyText.value = text;
        copyFallback.classList.remove('hidden');
        requestAnimationFrame(() => {
          manualCopyText.focus();
          manualCopyText.select();
          manualCopyText.setSelectionRange(0, manualCopyText.value.length);
        });
      }

      function legacyCopy(text) {
        const area = document.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.position = 'fixed';
        area.style.left = '-9999px';
        area.style.top = '0';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.focus();
        area.select();
        area.setSelectionRange(0, area.value.length);
        let copied = false;
        try { copied = document.execCommand('copy') === true; } catch (_) {}
        area.remove();
        return copied;
      }

      async function copyLog() {
        const text = buildLogText();
        if (!text.trim()) {
          copyBtn.textContent = 'Sem log';
          setTimeout(() => { copyBtn.textContent = 'Copiar log'; }, 1200);
          return;
        }

        let copied = false;

        if (navigator.clipboard?.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            copied = true;
          } catch (_) {}
        }

        if (!copied) copied = legacyCopy(text);

        if (copied) {
          showCopiedState();
          return;
        }

        manualCopyFallback(text);
      }

      pauseBtn.addEventListener('click', () => {
        paused = !paused;
        pauseBtn.textContent = paused ? 'Retomar scroll' : 'Pausar scroll';
        if (!paused) terminal.scrollTop = terminal.scrollHeight;
      });
      copyBtn.addEventListener('click', copyLog);
      clearBtn.addEventListener('click', requestClear);
      manualSelectBtn.addEventListener('click', () => {
        manualCopyText.focus();
        manualCopyText.select();
        manualCopyText.setSelectionRange(0, manualCopyText.value.length);
      });
      manualCloseBtn.addEventListener('click', () => copyFallback.classList.add('hidden'));
      copyFallback.addEventListener('click', event => {
        if (event.target === copyFallback) copyFallback.classList.add('hidden');
      });
      window.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !copyFallback.classList.contains('hidden')) {
          copyFallback.classList.add('hidden');
        }
      });

      window.addEventListener('storage', event => {
        if (event.key === SIGNAL_KEY && event.newValue) {
          const item = safeParse(event.newValue, null);
          if (item) {
            markConnected('storage');
            addEvent(item);
          }
        } else if (event.key === STORAGE_KEY && event.newValue) {
          markConnected('storage');
          mergeSnapshot(safeParse(event.newValue, []));
        }
      });

      window.addEventListener('message', event => {
        const data = event.data || {};
        if (data.type === 'LUX_DEVKIT_EVENT') {
          markConnected('janela');
          addEvent(data.event);
        } else if (data.type === 'LUX_DEVKIT_SNAPSHOT') {
          markConnected('janela');
          mergeSnapshot(data.events);
        } else if (data.type === 'LUX_DEVKIT_CLEAR') {
          clearLocal();
        }
      });

      try {
        if ('BroadcastChannel' in window) {
          channel = new BroadcastChannel(CHANNEL_NAME);
          channel.onmessage = event => {
            const data = event.data || {};
            if (data.type === 'event') {
              markConnected('BroadcastChannel');
              addEvent(data.event);
            } else if (data.type === 'snapshot') {
              markConnected('BroadcastChannel');
              mergeSnapshot(data.events);
            } else if (data.type === 'clear') {
              clearLocal();
            }
          };
          channel.postMessage({ type: 'request-snapshot' });
        }
      } catch (_) {
        channel = null;
      }

      readStorage();

      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: 'LUX_DEVKIT_READY' }, '*');
        }
      } catch (_) {}

      setInterval(() => {
        if (!connected) readStorage();
      }, 1000);
    })();
  </script>
</body>
</html>
